name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar Android SDK (ya viene instalado en el servidor)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dar permiso a gradlew
        run: chmod +x gradlew
      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Compilar APK debug
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: thinktwice-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en Releases (enlace de descarga directo)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk thinktwice.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest thinktwice.apk --title "thinktwice (última compilación)" \
            --notes "APK de depuración. Instálalo en el móvil; ver README.md para permisos."
